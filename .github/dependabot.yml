version: 2
updates:
  # Mantém as actions do CI atualizadas. Quando a stack for definida
  # (ADR-002), adicionar o ecossistema dela aqui (npm, pip, composer...).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "ci"

  # Dependências Python (ADR-002). Só patches/minors; major do Django é
  # decisão de ADR, não de bot.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "deps"
    ignore:
      - dependency-name: "django"
        update-types: ["version-update:semver-major"]
