name: CI

# Os nomes dos jobs (guardrails, segredos, testes, convencoes-pr) são os
# status checks exigidos no rulesets da main (.github/rulesets/main-checks.json).
# Renomear um job aqui = atualizar o ruleset, senão o PR trava esperando.

on:
  pull_request:
    branches: [main]
    # "edited": editar título/descrição do PR roda o CI de novo — o
    # convencoes-pr lê o título e o corpo do PR.
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  guardrails:
    name: guardrails
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Testa o próprio verificador
        run: bash .github/scripts/test-guardrails.sh
      - name: Verifica guardrails no código
        run: bash .github/scripts/guardrails.sh

  segredos:
    name: segredos
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read   # o gitleaks lista os commits do PR pela API
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # varre o histórico inteiro, não só o último commit
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"

  testes:
    name: testes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Postgres real, não SQLite: a unicidade do voto (G4) e a transação
    # atômica precisam ser testadas no mesmo banco da produção.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vitrine
          POSTGRES_PASSWORD: vitrine
          POSTGRES_DB: vitrine_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vitrine"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://vitrine:vitrine@localhost:5432/vitrine_test
      # Valor fixo só de teste. O segredo real vive no ambiente de produção (G3).
      QR_HMAC_SECRET: testetestetestetestetestetestete
      DJANGO_SECRET_KEY: testetestetestetestetestetestete
      RA_HMAC_SECRET: testetestetestetestetestetestete
      IP_HMAC_SECRET: testetestetestetestetestetestete
      DJANGO_URL_PUBLICA: https://testserver
    steps:
      - uses: actions/checkout@v7

      # Stack: Python + Django (ADR-002). Enquanto o esqueleto do projeto não
      # existir (sem requirements.txt), o job só informa. Quando ele entrar,
      # passa a EXIGIR testes passando — sem mexer no ruleset.
      - name: Projeto Django existe?
        id: projeto
        run: |
          if [ -f requirements.txt ]; then echo "existe=sim" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "existe=nao" >> "$GITHUB_OUTPUT"
          CODIGO=$(git ls-files | grep -vE '^(docs|specs|\.claude|\.cursor|\.github)/|\.(md|mdc)$|^\.(env\.example|gitignore|gitattributes)$' || true)
          if [ -n "$CODIGO" ]; then
            echo "::error title=Testes::Há código mas não há requirements.txt na raiz (ADR-002: Python + Django)."
            echo "$CODIGO"
            exit 1
          fi
          echo "::notice title=Testes::Esqueleto Django ainda não criado — nada para testar."

      - if: steps.projeto.outputs.existe == 'sim'
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - if: steps.projeto.outputs.existe == 'sim'
        run: pip install -r requirements.txt
      - if: steps.projeto.outputs.existe == 'sim'
        name: Migrations em dia (G16)
        run: python manage.py makemigrations --check --dry-run
      - if: steps.projeto.outputs.existe == 'sim'
        run: pytest   # sai com erro se nenhum teste for coletado (G17)

  convencoes-pr:
    name: convencoes-pr
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Verifica convenções do PR
        env:
          PR_TITLE:  ${{ github.event.pull_request.title }}
          PR_BODY:   ${{ github.event.pull_request.body }}
          PR_BRANCH: ${{ github.head_ref }}
          BASE_SHA:  ${{ github.event.pull_request.base.sha }}
          HEAD_SHA:  ${{ github.event.pull_request.head.sha }}
        run: bash .github/scripts/pr-check.sh
