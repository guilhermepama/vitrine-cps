[pytest]
DJANGO_SETTINGS_MODULE = config.settings
python_files = test_*.py
testpaths = tests cadastro vitrine votacao banca resultados
# --liveserver: o servidor de teste escuta em IPv4. Sem isso, no Windows o `localhost`
# tenta o ::1 antes e cada conexão nova espera ~2 s (os testes de medir_voto estouram o tempo).
addopts = --strict-markers --liveserver=127.0.0.1
filterwarnings =
    ignore:No directory at:UserWarning
